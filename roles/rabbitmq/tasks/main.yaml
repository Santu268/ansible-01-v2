- name: copy the rabbitmq repo
  ansible.builtin.copy:
    src: rabbitmq.repo
    dest: /etc/yum.repos.d/rabbitmq.repo
- name: installl rabit mq
  ansible.builtin.package:
    name: rabbitmq-server
    state: present
- name: enable the services of mq
  ansible.builtin.service:
    name: rabbitmq-server
    state: started
    enabled: true
- name: Create RabbitMQ user and set permissions
  community.rabbitmq.rabbitmq_user:
    user: "{{ rabbitmq_user }}"
    password: "{{ rabbitmq_pass }}"
    vhost: /
    configure_priv: .*
    read_priv: .*
    write_priv: .*
    tags: administrator
    state: present